# Odoo 18 for Order Desk tests: sales, purchase, inventory. http://127.0.0.1:8069
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes: [odoo-db:/var/lib/postgresql/data]
    restart: unless-stopped
  odoo:
    image: odoo:18.0
    depends_on: [db]
    ports: ["127.0.0.1:8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes: [odoo-data:/var/lib/odoo]
    restart: unless-stopped
volumes:
  odoo-db:
  odoo-data:
